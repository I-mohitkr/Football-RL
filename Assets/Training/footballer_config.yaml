behaviors:
  Footballer:
    # === Trainer ===
    trainer_type: ppo
    max_steps: 10000000                  # 10 Million steps (plenty of time to master the game)
    time_horizon: 128                    # Short horizon helps with fast offensive credit assignment
    summary_freq: 50000                  # Log stats every 50k steps to keep terminal clean

    # === Hyperparameters ===
    hyperparameters:
      batch_size: 2048                   # Large batch for stable gradients
      buffer_size: 20480                 # 10x batch size (standard ML-Agents ratio)
      learning_rate: 0.0003              # Standard PPO learning rate
      learning_rate_schedule: linear     # Decay LR toward 0 over max_steps
      beta: 0.02                         # High entropy bonus (0.02) forces agent to explore and prevents "Std=0" stalling
      epsilon: 0.2                       # PPO clipping range
      lambd: 0.95                        # GAE lambda
      num_epoch: 3                       # Passes over each buffer

    # === Neural Network ===
    network_settings:
      hidden_units: 256                  # 256 neurons per hidden layer (good for 24 observations)
      num_layers: 2                      # 2 hidden layers
      normalize: true                    # Automatically scales observation inputs

    # === Rewards ===
    reward_signals:
      extrinsic:
        gamma: 0.995                     # High gamma helps agent value the future (+5 goal reward) over immediate small penalties
        strength: 1.0
      curiosity:                         # Curiosity module rewards the agent for finding new states (helps it discover kicking)
        gamma: 0.99
        strength: 0.02                   
        encoding_size: 256

    # === Self-Play (Messi vs Ronaldo) ===
    self_play:
      window: 10                         # Keep last 10 versions of the agent to play against
      play_against_latest_model_ratio: 0.5  # 50% chance to play the newest model, 50% chance to play an older one
      save_steps: 50000                  # Save a snapshot of the opponent every 50k steps
      swap_steps: 50000                  # Swap the current opponent every 50k steps
      team_change: 100000                # Swap Red/Blue sides every 100k steps
      initial_elo: 1200                  # Standard starting ELO

    # === Checkpoints ===
    keep_checkpoints: 5                  # Keep the last 5 model files
    checkpoint_interval: 500000          # Save a checkpoint every 500k steps
